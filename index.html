<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>That Grl Blog</title>
  <style>
    :root{--bg:#fff;--ink:#20313d;--line:#e8edf0;--accent:#af8e9a;--soft:#f5f1f2;--radius:12px}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}button,a{-webkit-tap-highlight-color:transparent}.hidden{display:none!important}.shell,.reader{height:100%;overflow-x:hidden;overflow-y:scroll;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior-y:contain}.shell{max-width:760px;margin:auto;padding-bottom:max(28px,env(safe-area-inset-bottom))}.section-title{font-size:25px;line-height:1.15;margin:0;padding:24px 18px 15px;font-weight:780;letter-spacing:-.025em}
    .featured{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 18px 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.featured::-webkit-scrollbar,.categories::-webkit-scrollbar{display:none}.featured-card{flex:0 0 min(78vw,330px);scroll-snap-align:start;color:inherit;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}.featured-card .cover{aspect-ratio:1.55/1}.featured-card .copy{min-height:190px;padding:17px}.featured-card .title{font-size:23px;-webkit-line-clamp:3}.featured-card .excerpt{display:none}.featured-card .meta{border:0;padding-top:8px}
    .category-wrap{border-top:10px solid var(--line);border-bottom:1px solid var(--line);padding-bottom:17px}.category-label{font-size:17px;font-weight:760;margin:0;padding:20px 18px 12px}.categories{display:flex;gap:9px;overflow-x:auto;padding:0 18px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.category{flex:none;border:1px solid var(--accent);background:#fff;color:var(--ink);border-radius:999px;padding:10px 17px;font-size:15px;font-weight:700;white-space:nowrap}.category.active{background:var(--accent);color:#fff}
    .list-heading{display:flex;align-items:baseline;justify-content:space-between;padding:23px 18px 14px}.list-heading h2{font-size:25px;margin:0;letter-spacing:-.025em}.status{font-size:12px}.feed{display:grid;gap:12px;background:var(--line)}.card{display:block;color:inherit;text-decoration:none;background:#fff}.cover{display:block;width:100%;aspect-ratio:1.62/1;object-fit:cover;background:#f1eeeb}.copy{padding:20px 18px 17px}.title{font-size:26px;line-height:1.24;font-weight:750;letter-spacing:-.025em;margin:0 0 16px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.excerpt{font-size:18px;line-height:1.48;margin:0 0 14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.meta{display:flex;gap:17px;align-items:center;padding-top:12px;border-top:1px solid var(--line);font-size:17px}.meta span{display:inline-flex;gap:7px;align-items:center}.icon{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7}.more{display:block;min-width:180px;border:0;background:var(--accent);color:#fff;border-radius:999px;padding:13px 25px;margin:28px auto;font-weight:750;font-size:19px}.more:disabled{opacity:.5}.error{margin:14px 18px;border:1px solid #e6c8c4;background:#fff7f5;border-radius:12px;padding:14px;color:#8a2f27}.skeleton{animation:pulse 1.25s ease-in-out infinite;background:#f0ece9;border-radius:var(--radius);min-height:145px;margin:12px 18px}@keyframes pulse{50%{opacity:.52}}
    .reader{background:#fff;padding-bottom:max(28px,env(safe-area-inset-bottom))}.reader-bar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);padding:calc(7px + env(safe-area-inset-top)) 18px 7px}.reader-back{display:inline-flex;align-items:center;gap:7px;border:0;background:none;color:var(--ink);font-size:16px;font-weight:700;padding:8px 0}.reader-cover{display:block;width:100%;max-height:70vh;object-fit:cover}.reader-head{padding:24px 20px 12px}.reader-title{font-size:32px;line-height:1.18;letter-spacing:-.03em;margin:0 0 16px}.reader-meta{border:0;padding:0}.article-body{padding:8px 20px 44px;font-size:18px;line-height:1.65}.article-body p{margin:0 0 1.2em}.article-body h1,.article-body h2,.article-body h3,.article-body h4{line-height:1.2;margin:1.5em 0 .6em}.article-body img,.article-body video{display:block;width:100%;height:auto;margin:24px 0;border-radius:8px}.article-body blockquote{border-left:3px solid var(--accent);margin:24px 0;padding-left:18px}.article-body a{color:inherit}.article-body hr{border:0;border-top:1px solid var(--line);margin:28px 0}.article-body ul,.article-body ol{padding-left:25px}.article-empty{white-space:pre-wrap}
    @media(max-width:370px){.title{font-size:23px}.excerpt{font-size:16px}.featured-card .title{font-size:21px}.reader-title{font-size:28px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.skeleton{animation:none}}
  </style>
</head>
<body>
  <main class="shell" id="homeView">
    <section id="featuredSection">
      <h1 class="section-title">Featured Posts</h1>
      <div class="featured" id="featuredFeed" aria-live="polite"></div>
    </section>
    <section class="category-wrap">
      <h2 class="category-label">Explore by category</h2>
      <nav class="categories" id="categories" aria-label="Blog categories"></nav>
    </section>
    <div class="list-heading"><h2 id="listTitle">Latest Posts</h2><span class="status" id="status"></span></div>
    <div class="feed" id="feed" aria-live="polite"></div>
    <div class="error hidden" id="error"></div>
    <button class="more hidden" id="more" type="button">See All Posts</button>
  </main>
  <main class="reader hidden" id="readerView" aria-live="polite"></main>
  <script>
    const CONFIG={
      apiUrl:"https://www.thatgrlshop.com/_functions/blogPosts",
      pageSize:6,
      featuredSize:8,
      categories:[
        {label:"All",slugs:[]},
        {label:"Wellness",slugs:["hormonal-balance"]},
        {label:"Beauty",slugs:["hair-1","skin-beauty"]},
        {label:"Healthy Living",slugs:["fitness","healthy-diet"]},
        {label:"Style",slugs:["make-up","fashion","aesthetic"]},
        {label:"Mindset",slugs:["self-love","mindset"]}
      ]
    };
    const state={offset:0,total:Infinity,loading:false,category:"",scrollY:0};
    const home=document.querySelector("#homeView"),reader=document.querySelector("#readerView"),feed=document.querySelector("#feed"),featuredFeed=document.querySelector("#featuredFeed"),more=document.querySelector("#more"),error=document.querySelector("#error"),status=document.querySelector("#status"),listTitle=document.querySelector("#listTitle"),categories=document.querySelector("#categories");
    const eye='<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>';
    const heart='<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 5.8a5.4 5.4 0 0 0-7.7 0L12 6.9l-1.1-1.1a5.4 5.4 0 0 0-7.7 7.7L12 22l8.8-8.5a5.4 5.4 0 0 0 0-7.7Z"/></svg>';
    const esc=s=>String(s??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
    const compact=n=>Intl.NumberFormat("en",{notation:"compact",maximumFractionDigits:1}).format(Number(n)||0);
    function card(p,featured=false){return `<a class="${featured?"featured-card":"card"}" href="#post=${encodeURIComponent(p.id)}" data-post-id="${esc(p.id)}"><img class="cover" src="${esc(p.image||"")}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><div class="copy"><h3 class="title">${esc(p.title)}</h3><p class="excerpt">${esc(p.excerpt)}</p><div class="meta"><span>${heart}${compact(p.likes)}</span><span>${eye}${compact(p.views)}</span></div></div></a>`}
    function renderCategories(){categories.innerHTML=CONFIG.categories.map(c=>{const value=c.slugs.join(",");return `<button type="button" class="category${value===state.category?" active":""}" data-slugs="${esc(value)}">${esc(c.label)}</button>`}).join("")}
    function mediaUrl(value){const id=value?._id||value?.src?._id||"";if(id.startsWith("video/"))return `https://video.wixstatic.com/${id}`;if(id.startsWith("media/"))return `https://static.wixstatic.com/media/${id.slice(6)}`;if(id)return `https://static.wixstatic.com/media/${id}`;const v=typeof value==="string"?value:(value?.url||value?.src?.url||value?.src||"");if(String(v).startsWith("video/"))return `https://video.wixstatic.com/${v}`;if(String(v).startsWith("media/"))return `https://static.wixstatic.com/media/${String(v).slice(6)}`;if(!String(v).startsWith("wix:image://v1/"))return String(v);return `https://static.wixstatic.com/media/${String(v).slice(15).split("/")[0]}`}
    function textHtml(node){let out=esc(node?.textData?.text||"");for(const d of node?.textData?.decorations||[]){if(d.type==="BOLD")out=`<strong>${out}</strong>`;else if(d.type==="ITALIC")out=`<em>${out}</em>`;else if(d.type==="UNDERLINE")out=`<u>${out}</u>`;else if(d.type==="LINK")out=`<a href="${esc(d.linkData?.link?.url||d.linkData?.url||"#")}">${out}</a>`}return out}
    function ricosNode(n){const kids=()=>((n.nodes||[]).map(ricosNode).join(""));switch(n.type){case"TEXT":return textHtml(n);case"PARAGRAPH":return `<p>${kids()||"&nbsp;"}</p>`;case"HEADING":{const l=Math.min(4,Math.max(1,n.headingData?.level||2));return `<h${l}>${kids()}</h${l}>`}case"BULLETED_LIST":return `<ul>${kids()}</ul>`;case"ORDERED_LIST":return `<ol>${kids()}</ol>`;case"LIST_ITEM":return `<li>${kids()}</li>`;case"BLOCKQUOTE":return `<blockquote>${kids()}</blockquote>`;case"DIVIDER":return"<hr>";case"IMAGE":{const src=esc(mediaUrl(n.imageData?.image?.src||n.imageData?.image||n.imageData?.src));return src?`<img src="${src}" alt="${esc(n.imageData?.altText||"")}" loading="lazy">`:""}case"VIDEO":{const src=esc(mediaUrl(n.videoData?.video?.src||n.videoData?.src));const poster=esc(mediaUrl(n.videoData?.thumbnail?.src||n.videoData?.thumbnail));return src?`<video src="${src}"${poster?` poster="${poster}"`:""} controls playsinline preload="metadata"></video>`:""}default:return kids()}}
    const ricosHtml=doc=>(doc?.nodes||[]).map(ricosNode).join("");
    async function api(params){const u=new URL(CONFIG.apiUrl);Object.entries(params).forEach(([k,v])=>{if(v!==""&&v!=null)u.searchParams.set(k,v)});const r=await fetch(u,{headers:{Accept:"application/json"}});if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}
    async function loadFeatured(){featuredFeed.innerHTML='<div class="skeleton"></div>';try{const data=await api({featured:"true",offset:0,limit:CONFIG.featuredSize});const items=Array.isArray(data.items)?data.items:[];featuredFeed.innerHTML=items.map(p=>card(p,true)).join("");document.querySelector("#featuredSection").classList.toggle("hidden",!items.length)}catch(e){document.querySelector("#featuredSection").classList.add("hidden")}}
    async function loadPosts(){if(state.loading||state.offset>=state.total)return;state.loading=true;more.disabled=true;error.classList.add("hidden");if(!feed.children.length)feed.innerHTML='<div class="skeleton"></div><div class="skeleton"></div>';try{const data=await api({offset:state.offset,limit:CONFIG.pageSize,categoryId:state.category});const items=Array.isArray(data.items)?data.items:[];if(state.offset===0)feed.innerHTML="";feed.insertAdjacentHTML("beforeend",items.map(p=>card(p)).join(""));state.offset+=items.length;state.total=Number.isFinite(data.totalCount)?data.totalCount:state.offset+(items.length===CONFIG.pageSize?1:0);status.textContent=`${state.total} posts`;more.classList.toggle("hidden",state.offset>=state.total||!items.length)}catch(e){if(!state.offset)feed.innerHTML="";error.textContent=`The posts could not be loaded. (${e.message})`;error.classList.remove("hidden")}finally{state.loading=false;more.disabled=false}}
    async function openArticle(id,push=true){state.scrollY=home.scrollTop;home.classList.add("hidden");reader.classList.remove("hidden");reader.scrollTop=0;reader.innerHTML='<div class="skeleton"></div><div class="skeleton"></div>';if(push)history.pushState({postId:id},"",`#post=${encodeURIComponent(id)}`);try{const data=await api({postId:id});const p=data.item;if(!p)throw new Error("Post not found");const content=ricosHtml(p.richContent)||`<div class="article-empty">${esc(p.contentText||p.excerpt)}</div>`;reader.innerHTML=`<div class="reader-bar"><button class="reader-back" type="button">← Back</button></div>${p.image?`<img class="reader-cover" src="${esc(p.image)}" alt="">`:""}<header class="reader-head"><h1 class="reader-title">${esc(p.title)}</h1><div class="meta reader-meta"><span>${heart}${compact(p.likes)}</span><span>${eye}${compact(p.views)}</span></div></header><article class="article-body">${content}</article>`}catch(e){reader.innerHTML=`<div class="reader-bar"><button class="reader-back" type="button">← Back</button></div><div class="error">The article could not be loaded. (${esc(e.message)})</div>`}}
    function closeArticle(){reader.classList.add("hidden");home.classList.remove("hidden");reader.innerHTML="";requestAnimationFrame(()=>{home.scrollTop=state.scrollY})}
    document.addEventListener("click",e=>{const link=e.target.closest("[data-post-id]");if(link){e.preventDefault();openArticle(link.dataset.postId);return}const back=e.target.closest(".reader-back");if(back){history.back();return}const cat=e.target.closest(".category");if(cat){state.category=cat.dataset.slugs;state.offset=0;state.total=Infinity;feed.innerHTML="";const found=CONFIG.categories.find(c=>c.slugs.join(",")===state.category);listTitle.textContent=found?.label==="All"?"Latest Posts":found?.label||"Latest Posts";renderCategories();loadPosts()}});
    more.addEventListener("click",loadPosts);window.addEventListener("popstate",e=>{if(e.state?.postId)openArticle(e.state.postId,false);else closeArticle()});
    renderCategories();loadFeatured();loadPosts();
  </script>
</body>
</html>
