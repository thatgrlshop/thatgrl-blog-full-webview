<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>That Grl Blog</title>
  <style>
    :root{--bg:#fff;--ink:#20313d;--line:#e8edf0;--accent:#af8e9a;--radius:10px}
    *{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}html{scroll-behavior:auto}body{padding:0 0 max(32px,env(safe-area-inset-bottom));overflow-x:hidden}button,a{-webkit-tap-highlight-color:transparent}.reader{max-width:760px;margin:auto;background:#fff;min-height:100vh}.reader-bar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);padding:calc(7px + env(safe-area-inset-top)) 18px 7px}.reader-back{display:inline-flex;align-items:center;gap:7px;border:0;background:none;color:var(--ink);font-size:16px;font-weight:700;padding:8px 0}.reader-cover{display:block;width:100%;max-height:70vh;object-fit:cover}.reader-head{padding:24px 20px 12px}.reader-title{font-size:32px;line-height:1.18;letter-spacing:-.03em;margin:0 0 16px}.meta{display:flex;gap:17px;align-items:center;font-size:17px}.meta span{display:inline-flex;gap:7px;align-items:center}.icon{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7}.article-body{padding:8px 20px 44px;font-size:18px;line-height:1.65}.article-body p{margin:0 0 1.2em}.article-body h1,.article-body h2,.article-body h3,.article-body h4{line-height:1.2;margin:1.5em 0 .6em}.article-body img,.article-body video{display:block;width:100%;height:auto;margin:24px 0;border-radius:8px}.article-body blockquote{border-left:3px solid var(--accent);margin:24px 0;padding-left:18px}.article-body a{color:inherit}.article-body hr{border:0;border-top:1px solid var(--line);margin:28px 0}.article-body ul,.article-body ol{padding-left:25px}.article-empty{white-space:pre-wrap}.skeleton{animation:pulse 1.25s ease-in-out infinite;background:#f0ece9;border-radius:var(--radius);min-height:180px;margin:18px}.error{margin:18px;border:1px solid #e6c8c4;background:#fff7f5;border-radius:12px;padding:14px;color:#8a2f27}@keyframes pulse{50%{opacity:.52}}@media(max-width:370px){.reader-title{font-size:28px}.article-body{font-size:17px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.skeleton{animation:none}}
  </style>
</head>
<body>
  <main class="reader" id="reader" aria-live="polite">
    <div class="reader-bar"><button class="reader-back" id="back" type="button">← Back</button></div>
    <div class="skeleton"></div><div class="skeleton"></div>
  </main>
  <script>
    const API_URL="https://www.thatgrlshop.com/_functions/blogPosts";
    const reader=document.querySelector("#reader");
    const eye='<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>';
    const heart='<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 5.8a5.4 5.4 0 0 0-7.7 0L12 6.9l-1.1-1.1a5.4 5.4 0 0 0-7.7 7.7L12 22l8.8-8.5a5.4 5.4 0 0 0 0-7.7Z"/></svg>';
    const esc=s=>String(s??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
    const compact=n=>Intl.NumberFormat("en",{notation:"compact",maximumFractionDigits:1}).format(Number(n)||0);
    function mediaUrl(value){const id=value?._id||value?.src?._id||"";if(id.startsWith("video/"))return `https://video.wixstatic.com/${id}`;if(id.startsWith("media/"))return `https://static.wixstatic.com/media/${id.slice(6)}`;if(id)return `https://static.wixstatic.com/media/${id}`;const v=typeof value==="string"?value:(value?.url||value?.src?.url||value?.src||"");if(String(v).startsWith("video/"))return `https://video.wixstatic.com/${v}`;if(String(v).startsWith("media/"))return `https://static.wixstatic.com/media/${String(v).slice(6)}`;if(!String(v).startsWith("wix:image://v1/"))return String(v);return `https://static.wixstatic.com/media/${String(v).slice(15).split("/")[0]}`}
    function textHtml(node){let out=esc(node?.textData?.text||"");for(const d of node?.textData?.decorations||[]){if(d.type==="BOLD")out=`<strong>${out}</strong>`;else if(d.type==="ITALIC")out=`<em>${out}</em>`;else if(d.type==="UNDERLINE")out=`<u>${out}</u>`;else if(d.type==="LINK")out=`<a href="${esc(d.linkData?.link?.url||d.linkData?.url||"#")}">${out}</a>`}return out}
    function ricosNode(n){const kids=()=>((n.nodes||[]).map(ricosNode).join(""));switch(n.type){case"TEXT":return textHtml(n);case"PARAGRAPH":return `<p>${kids()||"&nbsp;"}</p>`;case"HEADING":{const l=Math.min(4,Math.max(1,n.headingData?.level||2));return `<h${l}>${kids()}</h${l}>`}case"BULLETED_LIST":return `<ul>${kids()}</ul>`;case"ORDERED_LIST":return `<ol>${kids()}</ol>`;case"LIST_ITEM":return `<li>${kids()}</li>`;case"BLOCKQUOTE":return `<blockquote>${kids()}</blockquote>`;case"DIVIDER":return"<hr>";case"IMAGE":{const src=esc(mediaUrl(n.imageData?.image?.src||n.imageData?.image||n.imageData?.src));return src?`<img src="${src}" alt="${esc(n.imageData?.altText||"")}" loading="lazy">`:""}case"VIDEO":{const src=esc(mediaUrl(n.videoData?.video?.src||n.videoData?.src));const poster=esc(mediaUrl(n.videoData?.thumbnail?.src||n.videoData?.thumbnail));return src?`<video src="${src}"${poster?` poster="${poster}"`:""} controls playsinline preload="metadata"></video>`:""}default:return kids()}}
    const ricosHtml=doc=>(doc?.nodes||[]).map(ricosNode).join("");
    function goBack(){if(history.length>1)history.back();else location.href="index.html?v=13&restore=1"}
    document.querySelector("#back").addEventListener("click",goBack);
    async function loadArticle(){window.scrollTo(0,0);const postId=new URLSearchParams(location.search).get("postId");if(!postId){reader.innerHTML='<div class="reader-bar"><button class="reader-back" type="button" onclick="location.href=\'index.html?v=13\'">← Back</button></div><div class="error">Post not found.</div>';return}try{const u=new URL(API_URL);u.searchParams.set("postId",postId);const r=await fetch(u,{headers:{Accept:"application/json"}});if(!r.ok)throw new Error(`HTTP ${r.status}`);const p=(await r.json()).item;if(!p)throw new Error("Post not found");const content=ricosHtml(p.richContent)||`<div class="article-empty">${esc(p.contentText||p.excerpt)}</div>`;reader.innerHTML=`<div class="reader-bar"><button class="reader-back" id="loadedBack" type="button">← Back</button></div>${p.image?`<img class="reader-cover" src="${esc(p.image)}" alt="">`:""}<header class="reader-head"><h1 class="reader-title">${esc(p.title)}</h1><div class="meta"><span>${heart}${compact(p.likes)}</span><span>${eye}${compact(p.views)}</span></div></header><article class="article-body">${content}</article>`;document.querySelector("#loadedBack").addEventListener("click",goBack);window.scrollTo(0,0)}catch(e){reader.innerHTML=`<div class="reader-bar"><button class="reader-back" id="errorBack" type="button">← Back</button></div><div class="error">The article could not be loaded. (${esc(e.message)})</div>`;document.querySelector("#errorBack").addEventListener("click",goBack)}}
    loadArticle();
  </script>
</body>
</html>
